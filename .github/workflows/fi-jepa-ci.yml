name: FI-JEPA baseline

on:
  push:
    paths:
      - 'FI-JEPA/**'
      - '.github/workflows/fi-jepa-ci.yml'
  pull_request:
    paths:
      - 'FI-JEPA/**'
      - '.github/workflows/fi-jepa-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: FI-JEPA/pyproject.toml
      - name: Install
        run: python -m pip install -e 'FI-JEPA[dev]'
      - name: Test
        run: pytest FI-JEPA/tests -q
      - name: Reproduce synthetic baseline
        run: python -m fi_jepa.cli --epochs 40 | tee fi-jepa-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fi-jepa-synthetic-report
          path: fi-jepa-report.json
          retention-days: 14
