name: FI-JEPA baseline

on:
  push:
    branches: [main]
    paths:
      - 'FI-JEPA/**'
      - '.github/workflows/fi-jepa-ci.yml'
  pull_request:
    paths:
      - 'FI-JEPA/**'
      - '.github/workflows/fi-jepa-ci.yml'

permissions:
  contents: read

concurrency:
  group: fi-jepa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHON_VERSION: '3.12.14'
  PIP_VERSION: '26.2.1'
  SETUPTOOLS_VERSION: '80.9.0'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            FI-JEPA/pyproject.toml
            FI-JEPA/requirements.lock.txt
      - name: Verify exact Python and pip toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = "${PYTHON_VERSION}"
          test "$(python -m pip --version | awk '{print $2}')" = "${PIP_VERSION}"
      - name: Install locked runtime, test, and build dependencies
        run: python -m pip install --no-deps -r FI-JEPA/requirements.lock.txt
      - name: Verify exact build backend
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c "import importlib.metadata; print(importlib.metadata.version('setuptools'))")" = "${SETUPTOOLS_VERSION}"
      - name: Install package without dependency or build-isolation resolution
        run: python -m pip install -e FI-JEPA --no-deps --no-build-isolation
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile source and tests
        run: python -m compileall -q FI-JEPA/src FI-JEPA/tests
      - name: Import installed package
        run: python -c "import fi_jepa; import fi_jepa.cli"
      - name: Verify installed CLI entry point
        run: fi-jepa --help >/dev/null
      - name: Record exact environment
        shell: bash
        run: |
          set -euo pipefail
          printf 'source_commit=%s\n' "${SOURCE_SHA}" > fi-jepa-environment.txt
          printf 'event_commit=%s\n' "${GITHUB_SHA}" >> fi-jepa-environment.txt
          printf 'workflow_commit=%s\n' "${GITHUB_WORKFLOW_SHA}" >> fi-jepa-environment.txt
          printf 'workflow_ref=%s\n' "${GITHUB_WORKFLOW_REF}" >> fi-jepa-environment.txt
          printf 'expected_python_version=%s\n' "${PYTHON_VERSION}" >> fi-jepa-environment.txt
          printf 'expected_pip_version=%s\n' "${PIP_VERSION}" >> fi-jepa-environment.txt
          printf 'expected_setuptools_version=%s\n' "${SETUPTOOLS_VERSION}" >> fi-jepa-environment.txt
          python --version >> fi-jepa-environment.txt
          python -m pip --version >> fi-jepa-environment.txt
          python -c "import importlib.metadata; print('setuptools ' + importlib.metadata.version('setuptools'))" >> fi-jepa-environment.txt
          python -m pip freeze --all >> fi-jepa-environment.txt
      - name: Test
        run: python -m pytest FI-JEPA/tests -q
      - name: Reproduce synthetic baseline
        run: python -m fi_jepa.cli --epochs 40 | tee fi-jepa-report.json
      - name: Record evidence digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            .github/workflows/fi-jepa-ci.yml \
            FI-JEPA/pyproject.toml \
            FI-JEPA/requirements.lock.txt \
            fi-jepa-report.json >> fi-jepa-environment.txt
          find FI-JEPA/src FI-JEPA/tests -type f -name '*.py' -print0 \
            | sort -z \
            | xargs -0 sha256sum >> fi-jepa-environment.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fi-jepa-synthetic-report-${{ env.SOURCE_SHA }}
          path: |
            fi-jepa-report.json
            fi-jepa-environment.txt
          if-no-files-found: error
          retention-days: 14
