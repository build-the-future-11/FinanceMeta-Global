name: FI-JEPA baseline

on:
  push:
    branches: [main]
    paths:
      - 'FI-JEPA/**'
      - '.github/workflows/fi-jepa-ci.yml'
  pull_request:
    paths:
      - 'FI-JEPA/**'
      - '.github/workflows/fi-jepa-ci.yml'

permissions:
  contents: read

concurrency:
  group: fi-jepa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: FI-JEPA/pyproject.toml
      - name: Install
        run: python -m pip install -e 'FI-JEPA[dev]'
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile source and tests
        run: python -m compileall -q FI-JEPA/src FI-JEPA/tests
      - name: Import installed package
        run: python -c "import fi_jepa; import fi_jepa.cli"
      - name: Verify installed CLI entry point
        run: fi-jepa --help >/dev/null
      - name: Record exact environment
        shell: bash
        run: |
          set -euo pipefail
          printf 'source_commit=%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > fi-jepa-environment.txt
          printf 'workflow_commit=%s\n' "$GITHUB_SHA" >> fi-jepa-environment.txt
          python --version >> fi-jepa-environment.txt
          python -m pip --version >> fi-jepa-environment.txt
          python -m pip freeze --all >> fi-jepa-environment.txt
      - name: Test
        run: python -m pytest FI-JEPA/tests -q
      - name: Reproduce synthetic baseline
        run: python -m fi_jepa.cli --epochs 40 | tee fi-jepa-report.json
      - name: Record evidence digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum FI-JEPA/pyproject.toml fi-jepa-report.json >> fi-jepa-environment.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fi-jepa-synthetic-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            fi-jepa-report.json
            fi-jepa-environment.txt
          if-no-files-found: error
          retention-days: 14
