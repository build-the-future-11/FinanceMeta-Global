name: FMP buildathon contract

on:
  pull_request:
    paths:
      - 'operations/fintech-studio-buildathon/**'
      - 'scripts/validate_fmp_buildathon_contract.py'
      - 'tests/test_validate_fmp_buildathon_contract.py'
      - '.github/workflows/fmp-buildathon-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'operations/fintech-studio-buildathon/**'
      - 'scripts/validate_fmp_buildathon_contract.py'
      - 'tests/test_validate_fmp_buildathon_contract.py'
      - '.github/workflows/fmp-buildathon-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fmp-buildathon-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate FMP operating contract
        run: python scripts/validate_fmp_buildathon_contract.py
      - name: Run FMP regression tests
        run: python -m unittest tests/test_validate_fmp_buildathon_contract.py -v
      - name: Record immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'source_commit=%s\n' "${SOURCE_SHA}"
            printf 'workflow_commit=%s\n' "$GITHUB_SHA"
            printf 'python=%s\n' "$(python --version 2>&1)"
          } > fmp-buildathon-contract-digests.txt
          sha256sum \
            operations/fintech-studio-buildathon/FMP_TECHNICAL_BRIEF.md \
            operations/fintech-studio-buildathon/fmp_contract.json \
            scripts/validate_fmp_buildathon_contract.py \
            tests/test_validate_fmp_buildathon_contract.py \
            >> fmp-buildathon-contract-digests.txt
          cat fmp-buildathon-contract-digests.txt
      - name: Upload FMP contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fmp-buildathon-contract-${{ env.SOURCE_SHA }}
          path: fmp-buildathon-contract-digests.txt
          if-no-files-found: error
          retention-days: 30
