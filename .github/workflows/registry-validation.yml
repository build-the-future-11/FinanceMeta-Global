name: Registry validation

on:
  push:
    branches: [main]
    paths:
      - 'registry/**'
      - 'scripts/validate_registry.py'
      - '.github/workflows/registry-validation.yml'
  pull_request:
    paths:
      - 'registry/**'
      - 'scripts/validate_registry.py'
      - '.github/workflows/registry-validation.yml'

permissions:
  contents: read

concurrency:
  group: registry-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate evidence registry
        run: python scripts/validate_registry.py
