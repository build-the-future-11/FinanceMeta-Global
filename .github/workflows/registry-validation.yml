name: Registry validation

on:
  push:
    branches: [main]
    paths:
      - 'registry/**'
      - 'scripts/validate_registry.py'
      - 'tests/test_validate_registry.py'
      - '.github/workflows/registry-validation.yml'
  pull_request:
    paths:
      - 'registry/**'
      - 'scripts/validate_registry.py'
      - 'tests/test_validate_registry.py'
      - '.github/workflows/registry-validation.yml'

permissions:
  contents: read

concurrency:
  group: registry-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Compile validator and regression tests
        run: python -m py_compile scripts/validate_registry.py tests/test_validate_registry.py
      - name: Run registry validator regression tests
        run: python -m unittest -v tests.test_validate_registry
      - name: Validate evidence registry
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'source_commit=%s\n' "${SOURCE_SHA}"
            printf 'workflow_commit=%s\n' "$GITHUB_SHA"
            printf 'workflow_ref=%s\n' "$GITHUB_REF"
            printf 'runner_image=%s\n' "${ImageOS:-ubuntu24}"
            printf 'python=%s\n' "$(python --version 2>&1)"
            printf 'pip=%s\n' "$(python -m pip --version)"
          } > registry-validation.txt
          python scripts/validate_registry.py | tee -a registry-validation.txt
      - name: Record registry digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum scripts/validate_registry.py tests/test_validate_registry.py >> registry-validation.txt
          find registry -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum >> registry-validation.txt
      - name: Upload registry validation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: registry-validation-${{ env.SOURCE_SHA }}
          path: registry-validation.txt
          if-no-files-found: error
          retention-days: 14
