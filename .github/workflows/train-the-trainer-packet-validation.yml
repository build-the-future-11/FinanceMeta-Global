name: Train-the-trainer packet validation

on:
  push:
    branches: [main]
    paths:
      - 'templates/train_the_trainer_delivery_packet.md'
      - 'templates/program_evidence_record.md'
      - 'evaluation/september-2026-financial-literacy-pilot/protocol.json'
      - 'evaluation/september-2026-financial-literacy-pilot/INTERVENTION.md'
      - 'tests/test_train_the_trainer_delivery_packet.py'
      - '.github/workflows/train-the-trainer-packet-validation.yml'
  pull_request:
    paths:
      - 'templates/train_the_trainer_delivery_packet.md'
      - 'templates/program_evidence_record.md'
      - 'evaluation/september-2026-financial-literacy-pilot/protocol.json'
      - 'evaluation/september-2026-financial-literacy-pilot/INTERVENTION.md'
      - 'tests/test_train_the_trainer_delivery_packet.py'
      - '.github/workflows/train-the-trainer-packet-validation.yml'

permissions:
  contents: read

concurrency:
  group: train-the-trainer-packet-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Compile packet regression tests
        run: python -m py_compile tests/test_train_the_trainer_delivery_packet.py
      - name: Run packet regression tests
        run: python -m unittest -v tests.test_train_the_trainer_delivery_packet
      - name: Record validation evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'source_commit=%s\n' "${SOURCE_SHA}"
            printf 'workflow_commit=%s\n' "$GITHUB_SHA"
            printf 'workflow_ref=%s\n' "$GITHUB_REF"
            printf 'runner_image=%s\n' "${ImageOS:-ubuntu24}"
            printf 'python=%s\n' "$(python --version 2>&1)"
          } > train-the-trainer-packet-validation.txt
          sha256sum \
            templates/train_the_trainer_delivery_packet.md \
            templates/program_evidence_record.md \
            evaluation/september-2026-financial-literacy-pilot/protocol.json \
            evaluation/september-2026-financial-literacy-pilot/INTERVENTION.md \
            tests/test_train_the_trainer_delivery_packet.py \
            >> train-the-trainer-packet-validation.txt
      - name: Upload validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: train-the-trainer-packet-validation-${{ env.SOURCE_SHA }}
          path: train-the-trainer-packet-validation.txt
          if-no-files-found: error
          retention-days: 14
