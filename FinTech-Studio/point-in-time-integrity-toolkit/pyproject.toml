[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "financemeta-data-audit"
version = "0.1.0"
description = "Read-only OHLCV market-data integrity checker for FinanceMeta FinTech Studio"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
financemeta-data-audit = "financemeta_data_audit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
